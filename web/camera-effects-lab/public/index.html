<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Живая демонстрация эффектов фона «Камера» из приложения Margaritaville.">
  <title>Лаборатория эффектов камеры</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="stage" aria-label="Изображение камеры с выбранным эффектом"></canvas>

  <div class="badge" id="badge" aria-live="polite"></div>

  <section class="sheet" id="sheet" aria-label="Настройки эффекта">
    <button class="sheet-handle" id="sheetToggle" type="button" aria-expanded="true">
      <span class="grip" aria-hidden="true"></span>
      <span class="handle-title" id="handleTitle">Обычный</span>
      <span class="handle-hint" id="handleHint">Свернуть</span>
    </button>

    <div class="sheet-body" id="sheetBody">
      <div class="row">
        <div class="segmented" role="group" aria-label="Камера">
          <button type="button" id="camBack" aria-pressed="true">Задняя</button>
          <button type="button" id="camFront" aria-pressed="false">Передняя</button>
        </div>
      </div>
      <div class="row sources">
        <button type="button" class="ghost" id="srcFile">Фото или видео</button>
        <button type="button" class="ghost" id="srcDemo">Демо-сцена</button>
        <input type="file" id="fileInput" accept="image/*,video/*" hidden>
      </div>
      <p class="status" id="status" role="status"></p>

      <div class="chips" id="categories" role="tablist" aria-label="Категории эффектов"></div>
      <div class="effects" id="effects" aria-label="Эффекты"></div>

      <div class="info">
        <h2 id="effectTitle">Обычный</h2>
        <p id="effectSubtitle"></p>
      </div>

      <div class="controls" id="controls"></div>

      <button type="button" class="reset" id="reset">Сбросить настройки эффекта</button>
      <p class="footnote">Изображение с камеры обрабатывается только на этом устройстве и никуда не отправляется.</p>
    </div>
  </section>

  <script type="module" src="js/app.js"></script>
</body>
</html>
